<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TimeSnap</title>
<link rel="icon" href="icon.png">
<style>
  :root { --bg: #f5f3ff; --text: #1c1b22; --sub: #6e6b7b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141320; --text: #f2f1f7; --sub: #a09db0; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  img { width: 96px; height: 96px; border-radius: 22px; }
  h1 { margin: 16px 0 8px; }
  p { color: var(--sub); line-height: 1.8; margin: 0; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="">
  <h1>TimeSnap</h1>
  <p>乗換案内や予定表のスクショから、<br>iPhone のアラームをまとめて作れるアプリ。</p>
  <p>mochido studio</p>
</main>
</body>
</html>
